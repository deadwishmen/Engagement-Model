# Cấu hình gốc - các file kaggle.yaml / colab.yaml kế thừa file này và chỉ ghi đè đường dẫn.

# --- Chạy thử nhanh để kiểm tra code ---
DRY_RUN: false
DRY_RUN_SAMPLES: 32
DRY_RUN_EPOCHS: 2

# --- Đường dẫn (đặt trong kaggle.yaml / colab.yaml) ---
OUTPUT_DIR: null                # thư mục chứa manifest/ và clips_*/
FEATURE_DIR: null               # chứa features_body/ và features_face/
SKELETON_DIR: null              # chứa <sample_id>.npy
CHECKPOINT_DIR: ./outputs
CHECKPOINT_NAME: best_model.pt
SPLIT_NAMES_JSON_PATH: null     # {"train": [...], "val": [...], "test": [...]}; null = dùng cột 'split'
EXCLUDE_UNKNOWN: true

# --- Dữ liệu đã cache ---
NUM_FRAMES: 16
NUM_KEYPOINTS: 17
FEATURE_DIM: 2048

# --- K-hop neighbors (trục KHÔNG GIAN: người khác, cùng thời điểm) ---
K_NEIGHBORS: 4
NEIGHBOR_CANDIDATE_MULTIPLIER: 6
NEIGHBOR_REQUIRE_TIME_OVERLAP: true
USE_ORIENTATION_PENALTY: true
ORIENTATION_ANGLE_THRESHOLD_DEG: 60.0
ORIENTATION_PENALTY: 1.0
USE_RELATION_FEATURES: false
RELATION_DIM: 13
SOCIAL_DROPOUT: 0.30
GNN_LAYERS: 2
GNN_HEADS: 4
USE_SOCIAL_RESIDUAL_GATE: true

# --- Context window (trục THỜI GIAN: clip trước/sau của cùng 1 người) ---
USE_CONTEXT_WINDOW: true
CONTEXT_WINDOW_SIZE: 2
CONTEXT_MAX_TIME_GAP_SECONDS: 60.0
CONTEXT_GNN_LAYERS: 2
CONTEXT_GNN_HEADS: 4
CONTEXT_DROPOUT: 0.20
USE_CONTEXT_RESIDUAL_GATE: true

# --- Encoder ---
EMBED_DIM: 192
DROPOUT: 0.40
SKELETON_CONF_THR: 0.05
USE_ADAPTIVE_ATTENTION_GATE: true
USE_RESNET_TO_SKELETON_FUSION: true
FILM_DROPOUT: 0.10

# --- Multimodal fusion ---
FUSION_LAYERS: 2
FUSION_HEADS: 4

# --- Auxiliary task hành vi/cảm xúc (chỉ dùng khi train) ---
USE_BEHAVIOR_EMOTION_AUX: true
AUX_LABEL_COLUMNS:
  pose: pose_label
  act: act_label
  obj: obj_label
  int: int_label
  emo: emo_label
AUX_LOSS_WEIGHT: 0.08
AUX_WARMUP_EPOCHS: 2
AUX_STOP_GRADIENT: true
AUX_HEAD_DROPOUT: 0.30

# --- Supervised Contrastive Loss ---
USE_SUPCON_LOSS: true
SUPCON_PROJECTION_DIM: 128
SUPCON_TEMPERATURE: 0.10
SUPCON_LOSS_WEIGHT: 0.30
SUPCON_WARMUP_EPOCHS: 3

# --- Loss phân loại chính ---
USE_FOCAL_LOSS: true
FOCAL_GAMMA: 1.25
FOCAL_ALPHA_SMOOTHING: 0.35
CLASS_WEIGHT_MODE: effective_number   # inverse | inverse_sqrt | effective_number
EFFECTIVE_NUMBER_BETA: 0.999
LABEL_SMOOTHING: 0.10

# --- Ordinal auxiliary loss (CORAL) ---
USE_ORDINAL_AUX_LOSS: true
ORDINAL_LABEL_ORDER: [eng_disengaged, eng_normal, eng_engaged, eng_very_engaged]
ORDINAL_LOSS_WEIGHT: 0.15
ORDINAL_WARMUP_EPOCHS: 3

# --- Sampling ---
USE_WEIGHTED_SAMPLER: true
SAMPLER_MODE: inverse                 # inverse | sqrt_inverse

# --- Huấn luyện ---
BATCH_SIZE: 16
GRAD_ACCUM_STEPS: 1
EPOCHS: 25
LR: 1.0e-4
WEIGHT_DECAY: 0.10
WARMUP_EPOCHS: 1
NUM_WORKERS: 4
PERSISTENT_WORKERS: true
PREFETCH_FACTOR: 4
PIN_MEMORY: true
USE_AMP: true
AMP_DTYPE: fp16
GRAD_CLIP_NORM: 1.0
EARLY_STOPPING_PATIENCE: 4

# --- Tune logit bias trên VALIDATION (không bao giờ trên test) ---
TUNE_LOGIT_BIAS: true
LOGIT_BIAS_MIN: -0.6
LOGIT_BIAS_MAX: 0.6
LOGIT_BIAS_STEP: 0.1

RUN_SPEED_BENCHMARK: true
BENCHMARK_BATCHES: 5
SEED: 42
